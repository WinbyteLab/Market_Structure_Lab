[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-smc-research"
version = "0.1.0"
description = "Read-only ICT/SMC research, event analysis, and MetaTrader 5 MCP bridge"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
ict-smc-mcp = "ict_smc_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
